[project]
name = "coelhonexus-fasthtml"
version = "1.0.0"
description = "COELHO Nexus - FastHTML web frontend (HTMX-driven, server-rendered)"
requires-python = ">=3.13"
dependencies = [
    "python-fasthtml>=0.14,<0.15",     # 0.14 dropped RouteX/RouterX/jupy_app/FastJupy — unused here, bump is a no-op
    "httpx>=0.28,<1.0",                # FastAPI /health round-trip + /api/{path:path} reverse proxy
    "uvicorn[standard]>=0.32,<1.0",    # [standard] enables --reload-include via watchfiles
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
