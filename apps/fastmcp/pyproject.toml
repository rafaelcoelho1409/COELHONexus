[project]
name = "coelhonexus-fastmcp"
version = "1.0.0"
description = "COELHO Nexus - FastMCP server (Model Context Protocol tool surface)"
requires-python = ">=3.13"

dependencies = [
    "fastmcp>=3.2,<4.0",
    "uvicorn[standard]>=0.32,<1.0",    # [standard] adds uvloop/httptools/watchfiles for --reload-include
    "httpx>=0.28,<1.0",
    "pydantic>=2.9,<3.0",
    "botocore>=1.34,<2.0",             # MinIO+Fernet BYOK store reader
    "cryptography>=46.0.7,<49",
    "psycopg[binary]>=3.2,<4.0",
    "aioboto3>=13.0,<15.0",
    "neo4j>=5,<6",
    "starlette>=1.3,<2.0",             # directly imported but only pulled in transitively (deptry DEP003)
]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]  # ASGI server run via entrypoint.sh CLI, not imported

[tool.uv]
# Application, not an installable library — see apps/fastapi/pyproject.toml's [tool.uv].
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyflakes>=3.2,<4.0",
    "deptry>=0.25,<1.0",
]
