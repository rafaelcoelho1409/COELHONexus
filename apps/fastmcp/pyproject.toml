[project]
name = "coelhonexus-fastmcp"
version = "1.0.0"
description = "COELHO Nexus - FastMCP server (Model Context Protocol tool surface)"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2,<4.0",
    # [standard] adds uvloop/httptools/watchfiles for --reload-include in entrypoint.sh.
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.9,<3.0",
    # MinIO+Fernet BYOK store reader; same versions as apps/fastapi.
    "botocore>=1.34,<2.0",
    "cryptography>=46.0.7,<49",
    "psycopg[binary]>=3.2,<4.0",
    "aioboto3>=13.0,<15.0",
    "neo4j>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyflakes>=3.2,<4.0",
]
