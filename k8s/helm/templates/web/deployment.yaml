{{- $appName := "web" -}}
{{- $appConfig := index $.Values $appName }}

apiVersion: apps/v1
{{- include "coelhonexus.DeploymentSettings" (dict "appName" $appName "root" .) | nindent 0 }}
spec:
  replicas: {{ $appConfig.replicas }}
  selector:
    matchLabels:
      app: coelhonexus-{{ $appName }}
  template:
    metadata:
      labels:
        app: coelhonexus-{{ $appName }}
    spec:
      {{- if and (eq .Values.environment "production") (.Values.registry.imagePullSecret) }}
      imagePullSecrets:
        - name: {{ .Values.registry.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: coelhonexus-{{ $appName }}
          image: {{ include "coelhonexus.imageName" (dict "appName" $appName "root" .) }}
          imagePullPolicy: {{ $appConfig.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- include "coelhonexus.DeploymentResources" (dict "appName" $appName "root" .) | nindent 10 }}
          {{- include "coelhonexus.ProbeSettings" (dict "appName" $appName "root" .) | nindent 10 }}
