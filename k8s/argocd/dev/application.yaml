apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coelhonexus
  namespace: argocd
  # Image Updater config in image-updater.yaml (CRD required for v1.1+)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/forgejo_admin/COELHONexus.git
    targetRevision: master
    path: k8s/helm
    # Helm configuration
    helm:
      releaseName: coelhonexus
      valueFiles:
        - values.yaml
      # values.yaml already configured with correct registry and imagePullPolicy
      # No overrides needed - all config is in values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: coelhonexus
  syncPolicy:
    automated:
      prune: true       # Delete resources not in Git
      selfHeal: true    # Revert manual changes
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
