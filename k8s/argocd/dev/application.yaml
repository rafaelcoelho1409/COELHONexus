apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coelhonexus
  namespace: argocd
  # Image Updater config in image-updater.yaml (CRD required for v1.1+)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/forgejo_admin/COELHONexus.git
    targetRevision: master
    path: k8s/helm
    # Helm configuration
    helm:
      releaseName: coelhonexus
      valueFiles:
        - values.yaml
      parameters:
        # Seed the image refs in the Image Updater's watched (localhost:5001/…)
        # form so its name-match always succeeds. Without this, stale
        # write-backs in the resolved-registry form (…@sha256:<old-digest>) can
        # pin the app forever: the updater skips the mismatched name and never
        # rewrites. Applying this also drops leftover params from older chart
        # generations (fastapi/fasthtml/fastmcp were removed from the chart).
        # bd keeps the chart default (values.yaml); if CI ever pushes bd, the
        # updater adds its digest param by itself.
        # Auto-sync heals from THIS value on every sync, and the updater
        # retags from here when CI pushes new digests. Same seed pattern as
        # COELHOSearchMCP / COELHOLLMRotator.
        - name: server.image
          forceString: true
          value: localhost:5001/coelhonexus-server:latest
        - name: web.image
          forceString: true
          value: localhost:5001/coelhonexus-web:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: coelhonexus
  syncPolicy:
    automated:
      prune: true       # Delete resources not in Git
      selfHeal: true    # Revert manual changes
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
