apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: coelhonexus
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: coelhonexus
      images:
        - alias: server
          imageName: coelho-cloud-registry:5000/coelhonexus-server:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              spec: server.image  # Full image reference (repo:tag@digest)
        - alias: web
          imageName: coelho-cloud-registry:5000/coelhonexus-web:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              spec: web.image  # Full image reference (repo:tag@digest)
  writeBackConfig:
    method: argocd
