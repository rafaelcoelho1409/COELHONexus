apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: coelhonexus

build:
  # Content-hash tag: a source change means a new tag, so Skaffold rebuilds and Kubernetes rolls out.
  tagPolicy:
    sha256: {}
  artifacts:
    # Server (FastAPI + FastMCP). Images use `localhost:5001` (k3d registry); every cluster's containerd
    # mirror resolves it, so the artifact name equals the pod's image and hot-reload sync matches.
    - image: localhost:5001/coelhonexus-server
      context: apps/server
      docker:
        dockerfile: Dockerfile.server
        noCache: false  # Enable layer caching for faster rebuilds
      sync:
        # Hot-reload (`skaffold dev` only). Manual sync is all-or-nothing: one unmatched file in a batch
        # forces a rebuild, so every source type is listed and .dockerignore hides __pycache__/*.pyc.
        manual:
          - src: "**/*.py"
            dest: /app
          - src: "**/*.yaml"
            dest: /app
          - src: "**/*.yml"
            dest: /app
          - src: "**/*.json"
            dest: /app
          - src: "**/*.toml"
            dest: /app
    # Next.js front end: a standalone build can't be hot-patched, so no `sync:` — edits rebuild.
    - image: localhost:5001/coelhonexus-web
      context: apps/web
      docker:
        dockerfile: Dockerfile.web
        noCache: false
        buildArgs:
          SERVER_URL: http://coelhonexus-server:8000
  local:
    # Push to the k3d registry (localhost:5001, see infrastructure/modules/k3d/files/registries.yaml.tpl).
    push: true
    # Always build from source; never import a same-named image from the registry.
    tryImportMissing: false
    useBuildkit: true
    useDockerCLI: true

# MANIFESTS (v4beta13 structure)
manifests:
  helm:
    releases:
      - name: coelhonexus
        chartPath: ./k8s/helm
        namespace: coelhonexus-dev
        createNamespace: true
        skipBuildDependencies: true
        # IMAGE_FULLY_QUALIFIED_<image with non-alphanumerics as "_"> = "<image>:<sha256-tag>"; the pod
        # runs exactly what was pushed, so hot-reload sync finds it.
        setValueTemplates:
          server.image: "{{.IMAGE_FULLY_QUALIFIED_localhost_5001_coelhonexus_server}}"
          web.image: "{{.IMAGE_FULLY_QUALIFIED_localhost_5001_coelhonexus_web}}"
          environment: local  # Enables --reload in uvicorn for hot-reload

deploy:
  helm:
    flags:
      install:
        - --timeout=10m
        - --wait
      upgrade:
        - --timeout=10m
        - --wait

portForward:
  - resourceType: service
    resourceName: coelhonexus-server
    namespace: coelhonexus-dev
    port: 8000
    localPort: 23030
    address: 0.0.0.0
  # Flower — Celery monitoring dashboard
  - resourceType: service
    resourceName: coelhonexus-flower
    namespace: coelhonexus-dev
    port: 5555
    localPort: 23032
    address: 0.0.0.0
  # Next.js front end
  - resourceType: service
    resourceName: coelhonexus-web
    namespace: coelhonexus-dev
    port: 3001
    localPort: 23035
    address: 0.0.0.0

# Needs docker-buildx (useBuildkit). Dev ports: 23030-23039.
# skaffold dev --cache-artifacts=false --no-prune=false --auto-sync=false
# skaffold run --port-forward=user 

profiles:
  - name: ci
    # CI (Forgejo Actions): builds all artifacts under the generic
    # `localhost:5001/…` names (LOCAL_ALIASES in ci.yml), tagged locally only —
    # CI retags server/web onto the secret-injected registry and pushes. The
    # dev Image Updater (k8s/argocd/dev/image-updater.yaml) watches the
    # `localhost:5001/…` names via the `localhost-mirror` alias. Build-only
    # profile — `skaffold build -p ci` never touches manifests/deploy, GitOps
    # owns deploys. Local `dev` flow above is untouched.
    build:
      # Base config's `local.push: true` makes every `skaffold build` push the
      # artifacts to their own fully-qualified names (localhost:5001/...) —
      # fine for dev (host port), fatal in CI (nothing listens there inside
      # dind, and the real registry is secret-injected). CI retags and pushes
      # with plain `docker push` instead (see ci.yml), so disable it here.
      # NOTE: profile sections REPLACE (not deep-merge) — restate the other
      # local.* fields or `useBuildkit` is lost and the Dockerfiles' mount
      # cache options fail on the classic builder.
      local:
        push: false
        tryImportMissing: false
        useBuildkit: true
        useDockerCLI: true
      artifacts:
        - image: localhost:5001/coelhonexus-server
          context: apps/server
          docker:
            dockerfile: Dockerfile.server
            noCache: false
        - image: localhost:5001/coelhonexus-web
          context: apps/web
          docker:
            dockerfile: Dockerfile.web
            noCache: false
            buildArgs:
              SERVER_URL: http://coelhonexus-server:8000
